[profile.default]
src = "contracts"
test = "contracts/test"
script = "scripts"
out = "out"
libs = ["SliverVineGate/lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 20000
evm_version = "shanghai"
via_ir = true
remappings = [
  "forge-std/=SliverVineGate/lib/forge-std/src/",
  "slivervine-gate/=SliverVineGate/src/"
]
fs_permissions = [
  { access = "read", path = "./contracts/test/fixtures" },
  { access = "read-write", path = "./artifacts" }
]
