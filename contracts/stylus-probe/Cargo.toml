[package]
name = "slivervine-soil-probe"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "On-chain fixed-point soil resistance coprocessor for Arbitrum Stylus verification"

[dependencies]
stylus-sdk = "0.10.7"
alloy-primitives = "1.5.7"
alloy-sol-types = "1.5.7"

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = ["stylus-sdk/mini-alloc"]

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "z"
