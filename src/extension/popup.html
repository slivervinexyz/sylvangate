<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SliverVine Retail Guard</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 280px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0f1419;
        color: #e7ecf3;
        padding: 16px;
      }
      .header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      .shield {
        width: 36px; height: 36px; border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-size: 18px; transition: background 0.2s, color 0.2s;
      }
      .shield.on { background: #0d3d2a; color: #3dd68c; }
      .shield.off { background: #2a2f36; color: #8b949e; }
      h1 { font-size: 14px; font-weight: 600; line-height: 1.3; }
      .sub { font-size: 11px; color: #8b949e; margin-top: 2px; }
      .row {
        display: flex; align-items: center; justify-content: space-between;
        background: #1a2129; border-radius: 10px; padding: 12px 14px;
      }
      .label { font-size: 13px; font-weight: 500; }
      .status { font-size: 11px; margin-top: 3px; }
      .status.on { color: #3dd68c; }
      .status.off { color: #8b949e; }
      .switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
      .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
      .slider {
        position: absolute; inset: 0; cursor: pointer; border-radius: 24px;
        background: #3d444d; transition: background 0.2s;
      }
      .slider::before {
        content: ""; position: absolute; width: 18px; height: 18px;
        left: 3px; bottom: 3px; background: #fff; border-radius: 50%;
        transition: transform 0.2s;
      }
      input:checked + .slider { background: #238636; }
      input:checked + .slider::before { transform: translateX(20px); }
    </style>
  </head>
  <body>
    <div class="header">
      <div id="badge" class="shield on" aria-hidden="true">🛡️</div>
      <div>
        <h1>SliverVine Retail Guard</h1>
        <p class="sub">EIP-1193 Pre-Consensus Shield</p>
      </div>
    </div>
    <div class="row">
      <div>
        <div class="label">Protection</div>
        <div id="status" class="status on">Active — Guard enabled</div>
      </div>
      <label class="switch" aria-label="Toggle guard">
        <input id="guard-toggle" type="checkbox" checked />
        <span class="slider"></span>
      </label>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
