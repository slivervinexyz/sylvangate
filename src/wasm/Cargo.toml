[package]
name = "soil_core"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "SliverVine M4 no_std soil + session core for Cloudflare Workers Wasm"

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
