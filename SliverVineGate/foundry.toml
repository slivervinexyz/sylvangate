[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 20000
via_ir = false
evm_version = "shanghai"
gas_reports = ["SliverVineGate", "GatedExecutor"]

[profile.default.fuzz]
runs = 1024

[profile.deep.fuzz]
runs = 65535

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
